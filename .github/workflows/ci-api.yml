name: API - Spring Boot CI

on:
  push:
    branches: ["main", "feature/*", "fix/*", "infra/*"]
    paths:
      - 'api/**'
      - '.github/workflows/**'
  pull_request:
    branches: ["main"]
    paths:
      - 'api/**'

env:
  JAVA_VERSION: '21'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api/app

    steps:
      # --- 1️⃣ Checkout source code ---
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for SonarCloud

      # --- 2️⃣ Setup JDK 21 ---
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      # --- 3️⃣ Cache SonarCloud packages ---
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # --- 4️⃣ Cache OWASP NVD data ---
      - name: Cache OWASP NVD data
        uses: actions/cache@v4
        with:
          path: ~/.owasp-data
          key: ${{ runner.os }}-owasp-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-owasp-

      # --- 5️⃣ Build & Tests with Jacoco coverage ---
      - name: Build and test with coverage
        run: mvn clean verify

      # --- 6️⃣ SpotBugs ---
      - name: Run SpotBugs analysis
        run: mvn spotbugs:check
        continue-on-error: true  # ⚠️ ne bloque pas le pipeline

      # --- 7️⃣ OWASP Dependency Check ---
      - name: OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.API_NVD }}
        run: mvn dependency-check:check -DnvdApiKey=${NVD_API_KEY}
        continue-on-error: true

      # --- 8️⃣ SonarCloud check ---
      - name: SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=Chebah-Amine_contact_management \
            -Dsonar.organization=chebah-amine \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.java.coveragePlugin=jacoco \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      # --- 9️⃣ Upload reports ---
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: api/target/surefire-reports/
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: api/target/site/jacoco/
          retention-days: 7

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: api/target/dependency-check-report.html
          retention-days: 30
